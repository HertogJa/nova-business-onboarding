<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NOVA BANQ Business · Veris B.V.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nova: {
              bg: '#F7F5F0',
              ink: '#1A1A1A',
              ink2: '#6B6B6B',
              border: '#E2DED8',
              green: '#0A8F6E',
              greenDark: '#066B52',
              yellow: '#FFD23F',
              warm: '#FFF7ED',
              warmBorder: '#FED7AA',
              walletBg: '#F0F7F4',
            },
            claude: {
              bg: '#1E2433',
            }
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            serif: ['"Instrument Serif"', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    html, body { background: #F7F5F0; min-width: 880px; }
    body { font-family: 'Inter', system-ui, sans-serif; color: #1A1A1A; }
    .font-editorial { font-family: 'Instrument Serif', serif; font-style: italic; }
    /* keep no scrollbars on phone */
    .phone-scroll::-webkit-scrollbar { display: none; }
    .phone-scroll { scrollbar-width: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }
    .fade-in { animation: fadeIn 320ms ease-out both; }
    @keyframes pulseLine {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    .pulse-a { animation: pulseLine 4.2s ease-in-out infinite; }
    .pulse-b { animation: pulseLine 4.8s ease-in-out infinite 0.6s; }
    .pulse-c { animation: pulseLine 5.4s ease-in-out infinite 1.2s; }
    @keyframes softRise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .soft-rise { animation: softRise 420ms ease-out both; }
    @keyframes spinOnce {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spin-once { animation: spinOnce 300ms ease-out; }
    .stagger > * { opacity: 0; animation: softRise 420ms ease-out forwards; }
    .stagger > *:nth-child(1) { animation-delay: 60ms; }
    .stagger > *:nth-child(2) { animation-delay: 160ms; }
    .stagger > *:nth-child(3) { animation-delay: 260ms; }
    .stagger > *:nth-child(4) { animation-delay: 360ms; }
    .stagger > *:nth-child(5) { animation-delay: 460ms; }
    .stagger > *:nth-child(6) { animation-delay: 560ms; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react" src="src/shared.jsx"></script>
  <script type="text/babel" data-presets="react" src="src/screen1.jsx"></script>
  <script type="text/babel" data-presets="react" src="src/screens-a.jsx"></script>
  <script type="text/babel" data-presets="react" src="src/screens-b.jsx"></script>
  <script type="text/babel" data-presets="react" src="src/screens-c.jsx"></script>
  <script type="text/babel" data-presets="react" src="src/app.jsx"></script>
</body>
</html>
